[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tinybrain"
version = "0.1.0"
description = "一个小型中文语言模型（多流残差、Engram 记忆、滑动窗口注意力），以及配套的预训练数据集构建流水线"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["torch>=2.5"]

[project.optional-dependencies]
data = ["numpy", "pyarrow", "OpenCC", "zstandard"]
fast = ["gigatoken"]  # 切词快一个数量级（tools.prepare 自动使用）；Windows 上建议在 WSL 里装
cuda = ["liger-kernel>=0.8.5,<0.9"]
cudnn = ["torch>=2.13", "liger-kernel>=0.8.5,<0.9", "nvidia-cudnn-frontend>=1.32.3,<1.33"]
monitor = ["tensorboard>=2.18"]

[project.scripts]
tinybrain = "tools.cli:main"   # pip install -e . 之后：tinybrain pretrain、tinybrain chat……

[tool.setuptools.packages.find]
include = ["lm*", "training*", "inference*", "eval*", "tools*", "dataset*"]
